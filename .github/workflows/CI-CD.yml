name: Setup Fortran Conda CI/CD

on:
  push:
    branches: [main, dev]
    paths-ignore: ['README.md','CHANGELOG.md','VERSION','LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md','CHANGELOG.md','VERSION','LICENSE']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test_fpm:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: ${{ matrix.os }}_${{ matrix.compiler }}_fpm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-latest,  compiler: gfortran}
        - {os: ubuntu-latest,  compiler: ifx     }
        # Higher GNU optimization spends most of this job compiling fpm's
        # feature_collection module. Keep an optimized release build on macOS.
        - {os: macos-latest,   compiler: gfortran, release_profile: ci-release}
        - {os: windows-latest, compiler: gfortran}

    steps:
      # fpm has intermittently crashed with corrupted progress output while
      # compiling targets concurrently on Windows. Use its serial backend.
      - name: Serialize fpm builds on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"OMP_NUM_THREADS=1" >> $env:GITHUB_ENV'

      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@latest
        with:
          platform: ${{ matrix.os }}
          compiler: ${{ matrix.compiler }}

      - name: fpm build (debug)
        run: fpm build --compiler ${{ env.FPM_FC }} --profile debug --verbose
      - name: fpm build (release)
        run: fpm build --compiler ${{ env.FPM_FC }} --profile ${{ matrix.release_profile || 'release' }} --verbose

      - name: fpm test (release)
        run: fpm test --compiler ${{ env.FPM_FC }} --profile ${{ matrix.release_profile || 'release' }}

      - name: install fpm-watch
        run: fpm install --compiler ${{ env.FPM_FC }} --profile ${{ matrix.release_profile || 'release' }} --prefix .

      - name: fpm-watch test
        if: runner.os != 'Windows'
        shell: bash
        run: ./bin/fpm-watch --watch-once test --profile debug

      - name: fpm-watch test
        if: runner.os == 'Windows'
        run: .\bin\fpm-watch.exe --watch-once test --profile debug

      - name: Watcher behavior regressions
        run: python test/integration.py --watcher ./bin/fpm-watch${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Supervisor behavior regressions
        run: python test/platform_regression.py ./bin/fpm-watch${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Response file regressions
        run: python test/response_regression.py --watcher ./bin/fpm-watch${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Release preparation regressions
        if: runner.os != 'Windows'
        run: python test/release_regression.py

  doc_ford:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Generate FORD Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Setup and Generate FORD Documentation
        uses: gha3mi/setup-fortran-conda@latest
        with:
          compiler: gfortran
          generate-doc-ford: true
          ford-working-directory: .
          ford-config: README.md
          ford-output-directory: doc
          ford-branch: gh-pages-ford
          ford-target-folder: .

  linter_fortitude:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Run Fortitude Linter
    runs-on: ubuntu-latest
    steps:
      - name: Run Fortitude Linter
        uses: gha3mi/setup-fortran-conda@latest
        with:
          fortitude-check: true
          fortitude-settings: "--output-format github"

  update_readme_table:
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Update README.md status table
    needs: [test_fpm]
    runs-on: ubuntu-latest
    steps:
      - name: Update README status
        uses: gha3mi/setup-fortran-conda@latest
        with:
          update-readme-table: true
          update-readme-token: ${{ secrets.GH_PAT_FPM_WATHCH }}   # Update with your GitHub personal access token
          update-readme-user-name: "Seyed Ali Ghasemi" # Update with your name
          update-readme-user-email: "info@gha3mi.com"  # Update with your email
