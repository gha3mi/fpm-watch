name        = "fpm-watch"
description = "fpm plugin for watching source files and automatically rebuilding, testing or running the project on changes"
version     = "VERSION"
author      = "Seyed Ali Ghasemi"
copyright   = "Copyright 2026, Seyed Ali Ghasemi"
homepage    = "https://github.com/gha3mi/fpm-watch"
license     = "MIT"

[fortran]
source-form = "free"

[library]

[preprocess]
[preprocess.cpp]

[dependencies]
# Current upstream fpm plus the empty-file unit cleanup fix on gha3mi/fpm's dev branch.
fpm  = { git = "https://github.com/gha3mi/fpm", rev = "e2798a98b9cb6ca373e8d9a2c7ec3b01bfee03de" }

[profiles]
ci-release = ["ci-release"]

[features.ci-release]
description = "CI build with GNU compile-time and Intel optimizer workarounds"
[features.ci-release.gfortran]
flags = "-O1 -Wimplicit-interface -fPIC -fmax-errors=1 -fcoarray=single"
[features.ci-release.ifx.linux]
# ifx 2026.2 miscompiles fpm 0.13.0's empty-directory scan at -O1 and -O2.
flags = "-O0 -g -traceback -fp-model=precise -pc64 -align all -error-limit 1 -reentrancy threaded -nogen-interfaces -assume byterecl"

[extra.ford]
project             = "fpm-watch"
year                = "2026"
author              = "Seyed Ali Ghasemi"
email               = "info@gha3mi.com"
github              = "https://github.com/gha3mi"
license             = "MIT"
src_dir             = ["src"]
output_dir          = "doc"
source              = true
incl_src            = true
graph               = true
coloured_edges      = true
search              = true
print_creation_date = true
sort                = "permission-alpha"
display             = ["public", "private", "protected"]

[extra.fortitude.check]
ignore = ["S001", "C003"]
